<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Congratulations Winner!</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .card-shadow {
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
    </style>
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen p-4">

    <!-- Winner Announcement Card -->
    <div class="bg-white max-w-md w-full rounded-2xl border border-slate-200 card-shadow overflow-hidden text-center p-6 relative">
        
        <!-- Header / Logo Area -->
        <div class="flex justify-center items-center gap-2 mb-4">
            <span class="text-2xl font-black tracking-wider text-purple-700">KHALTI PAY WINNER</span>
        </div>

        <!-- Congratulations Badge -->
        <div class="inline-block bg-red-600 text-white font-extrabold text-xl px-6 py-2 rounded-full shadow-md uppercase tracking-wide mb-6">
            CONGRATULATIONS
        </div>

        <!-- Photo Frame -->
        <div class="relative w-48 h-56 mx-auto mb-6 bg-slate-100 p-2 border-2 border-slate-200 rounded-lg shadow-inner">
            <!-- APNI PHOTO DA LINK YA FILE NAME IETHE PAO -->
            <img src="myphoto.jpg" alt="Winner Photo" class="w-full h-full object-cover rounded">
        </div>

        <!-- Winner Details -->
        <h2 class="text-3xl font-black text-slate-800 mb-1">Lucky Thapa</h2>
        <p class="text-slate-500 font-semibold mb-4">970-2376044</p>

        <!-- Prize Announcement -->
        <div class="bg-purple-50 border border-purple-200 rounded-xl p-3 mb-6">
            <p class="text-purple-900 font-bold text-lg">
                Winner of Re. 1 iPhone 17 Campaign 🎉
            </p>
        </div>

        <!-- Footer -->
        <p class="text-xs text-slate-400 font-medium">Khaltipay winner.com</p>
    </div>

</body>
</html>
